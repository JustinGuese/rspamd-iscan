# Redis — deployed in-cluster by default.
# Set enabled: false and override rspamd.redisServer to use an external instance.
redis:
  enabled: true
  image: redis:7-alpine
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

rspamd:
  image: rspamd/rspamd:latest
  # Points to the in-cluster Redis service by default.
  # Override when redis.enabled=false.
  redisServer: "spamfilter-redis:6379"
  # controllerPassword is auto-generated on first deploy and stored in the
  # spamfilter-rspamd-credentials Secret. Do not set this here.
  # Bayes classifier tuning. Upstream default min_learns=200 keeps Bayes OFF until
  # 200 spam have been learned; lowered so it activates with a small corpus. Raise
  # minLearns back toward 200 once BAYES_SPAM learned count is comfortably above it.
  bayes:
    minLearns: 30
    minTokens: 5
  # Manually curated sender-domain blocklist. A matching From-domain adds `score`
  # (default pushes over the spam threshold -> filed to Junk; not a hard reject).
  # NEVER add freemail domains (gmail.com/outlook.com/hotmail.com) - blocks legit mail.
  # Senders rarely repeat by address, so this is a supplement to Bayes, not the main filter.
  senderBlocklist:
    enabled: true
    score: 7.0
    domains: []
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

rspamdIscan:
  image: guestros/rspamd-iscan:latest
  imapAddr: "imap.example.com:993"
  imapUser: "user@example.com"
  imapPassword: ""
  mailboxes:
    inbox: "INBOX"
    spam: "INBOX.Junk"
    ham: "INBOX"
    undetected: "INBOX.Undetected"
    backup: "INBOX.BackupMailbox"
    scan: "INBOX.Unscanned"
  tempDir: "/tmp"
  keepTempFiles: true
  spamThreshold: 6.0
  logImapData: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
